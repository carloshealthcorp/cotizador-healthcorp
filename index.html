<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title> </title>
<style>
  :root{
    --blue-dark:#0a4d8c;
    --blue:#1e7fc7;
    --blue-light:#eaf4fc;
    --teal:#006cad;
    --accent:#00969b;
    --accent-light:#cceeed;
    --gray-mouse:#b3b8bd;
    --bright-orange:#fff200;
    --gray-900:#1f2937;
    --gray-600:#5b6470;
    --gray-300:#d8dee5;
    --gray-200:#e7ebee;
    --gray-100:#f4f6f8;
    --red:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e9edf1;
    margin:0;
    padding:24px;
    color:var(--gray-900);
  }
  .toolbar{
    max-width:1000px;
    margin:0 auto 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    border-radius:6px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s;
  }
  .btn:hover{filter:brightness(0.92);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-dark{background:var(--blue-dark);color:#fff;}
  .btn-outline{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue-dark);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn-sm{padding:6px 10px;font-size:12px;}

  .sheet{
    max-width:1000px;
    margin:0 auto;
    background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.08);
    border-radius:4px;
    padding:40px 44px;
  }
  .quote-box{width:fit-content;}
  .cotiz-banner{
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;
    padding:9px 14px;
    border-radius:6px 6px 0 0;
  }
  .doc-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid var(--blue);
    padding-bottom:14px;
    margin-bottom:20px;
    gap:20px;
  }
  .logo-img{height:100px;width:auto;display:block;max-width:340px;object-fit:contain;}
  .quote-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
  .quote-num-row{
    display:flex;
    border:1px solid var(--gray-300);
    border-top:none;
    border-radius:0 0 6px 6px;
    overflow:hidden;
  }
  .qn-label{
    background:var(--gray-100);
    color:var(--gray-600);
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:9px 14px;
    display:flex;
    align-items:center;
    white-space:nowrap;
    border-right:1px solid var(--gray-300);
  }
  .qn-value{
    background:#fff;
    padding:5px 12px;
    display:flex;
    align-items:center;
  }
  .qn-value input{
    border:none;
    padding:0;
    font-size:15px;
    font-weight:700;
    color:var(--gray-900);
    width:110px;
  }
  .quote-dates{display:flex;gap:12px;justify-content:flex-end;margin-top:10px;}
  .quote-dates > div{width:130px;}
  .quote-dates .field-label{margin-bottom:2px;}

  .parties-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:24px;
  }
  .party-panel{
    border:1px solid var(--gray-300);
    border-radius:6px;
    padding:12px 14px;
  }
  .party-title{
    font-weight:800;
    color:var(--blue-dark);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:10px;
    border-bottom:1px solid var(--gray-100);
    padding-bottom:6px;
  }
  .party-fields{display:flex;flex-direction:column;gap:7px;}
  .party-fields > div{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;}
  .party-fields .field-label{margin-bottom:0;}
  .party-fields input{padding:5px 8px;font-size:13px;}
  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gray-600);
    font-weight:700;
    margin-bottom:4px;
    display:block;
  }
  input, textarea, select{
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--gray-300);
    border-radius:5px;
    padding:7px 9px;
    width:100%;
    color:var(--gray-900);
  }
  textarea{resize:vertical;}
  .print-mirror{display:none;}

  .category{
    margin-bottom:22px;
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
  }
  .category-header{
    background:var(--accent);
    color:#fff;
    padding:9px 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .category-header input{
    background:transparent;
    border:none;
    color:#fff;
    font-weight:700;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:2px 4px;
  }
  .category-header input::placeholder{color:#cfe3f5;}

  .line{
    padding:16px 14px 14px;
    border-top:2px solid var(--blue);
  }
  .line:first-of-type{border-top:none;padding-top:14px;}

  .carousel-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .carousel-thumb{
    flex:0 0 165px;
    width:165px;
    aspect-ratio:1/1;
    border:1.5px dashed var(--gray-300);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    line-height:1.3;
    color:var(--gray-600);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background:var(--gray-100);
    text-align:center;
    padding:4px;
  }
  .carousel-thumb.add-thumb{border-color:var(--blue);color:var(--blue);font-weight:700;background:var(--blue-light);}
  .carousel-thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;position:relative;}
  .carousel-thumb input[type=file]{display:none;}

  .line-body{
    display:grid;
    grid-template-columns:1fr 544px;
    gap:18px;
    align-items:center;
  }
  .desc-block{grid-column:1;}
  .right-col{grid-column:2;display:flex;flex-direction:column;align-items:center;}
  .main-image-slot{
    width:100%;
    aspect-ratio:1/1;
    border:1.5px dashed var(--gray-300);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:var(--gray-600);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background:var(--gray-100);
    text-align:center;
    padding:6px;
  }
  .main-image-slot.filled{border-style:solid;border-color:var(--gray-300);}
  .main-image-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .main-image-slot input[type=file]{display:none;}

  .img-remove{
    position:absolute;top:3px;right:3px;
    background:rgba(0,0,0,.55);color:#fff;
    border:none;border-radius:50%;
    width:18px;height:18px;font-size:11px;
    cursor:pointer;line-height:1;
    z-index:2;
  }

  .desc-block textarea{min-height:110px;font-size:13px;line-height:1.5;}
  .desc-block .field-label{margin-top:8px;}

  .product-table{
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    margin:0 auto 14px;
    width:calc(100% - 38px);
  }
  .pt-header{
    display:grid;
    grid-template-columns:1fr 55px 80px 65px 110px;
    background:var(--gray-mouse);
    color:var(--gray-900);
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .pt-header > div{padding:7px 10px;}
  .pt-row{
    display:grid;
    grid-template-columns:1fr 55px 80px 65px 110px;
    align-items:stretch;
    background:var(--bright-orange);
  }
  .pt-row > div{
    padding:9px 10px;
    border-top:1px solid #fff;
    border-left:1px solid #fff;
    display:flex;
    align-items:center;
    min-width:0;
  }
  .pt-row > div:first-child{border-left:none;}
  .pt-product{flex-direction:column !important;align-items:flex-start !important;gap:4px;min-width:0;}
  .pt-name{
    border:none;
    padding:0;
    font-weight:700;
    font-size:15px;
    color:var(--gray-900);
    width:100%;
  }
  .pt-meta{display:flex;flex-wrap:nowrap;gap:10px;font-size:11px;color:var(--gray-600);min-width:0;overflow:hidden;}
  .pt-meta span{display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0;}
  .pt-meta input{
    border:none;
    padding:0;
    font-size:11px;
    font-weight:700;
    color:var(--gray-900);
    width:64px;
    min-width:0;
  }
  .pt-num input{
    border:none;
    padding:0;
    text-align:center;
    font-weight:600;
  }
  .pt-num select{
    border:none;
    padding:0;
    text-align:center;
    font-weight:600;
    width:100%;
    background:transparent;
  }
  .pt-total{
    font-weight:800;
    color:var(--blue-dark);
    justify-content:flex-end !important;
  }


  .section-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:5px 10px;
    border-radius:4px;
    margin-bottom:8px;
  }

  .optionals-box{
    margin-top:10px;
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    background:var(--gray-100);
  }
  .optionals-box textarea, .standard-box textarea{min-height:70px;font-size:13px;line-height:1.5;background:#fff;}
  .box-header{
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:7px 10px;
  }
  .box-body{padding:8px 10px;}

  .gd-bar{
    display:grid;
    grid-template-columns:1fr 1fr;
    width:100%;
    min-height:42px;
    margin-top:12px;
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    page-break-inside:avoid;
  }
  .gd-cell{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 12px;
    border-left:1px solid var(--gray-300);
  }
  .gd-cell:first-child{border-left:none;}
  .gd-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--gray-600);
    white-space:nowrap;
  }
  .gd-cell input{border:none;padding:2px 0;font-weight:600;color:var(--gray-900);}

  .accop-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:14px;
  }
  .accop-col{min-width:0;}

  .standard-box{
    margin-top:10px;
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    background:var(--gray-100);
  }

  .line-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--gray-300);
  }
  .line-total{
    background:var(--blue-light);
    border-radius:6px;
    padding:8px 12px;
    text-align:right;
    font-weight:700;
    color:var(--blue-dark);
    font-size:15px;
  }
  .details-toggle{
    background:none;
    border:none;
    color:var(--blue);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    cursor:pointer;
    padding:2px 0;
    text-align:left;
    width:auto;
  }
  .details-toggle:hover{text-decoration:underline;}
  .line-details.collapsed{display:none;}

  .cat-subtotal{
    background:var(--gray-100);
    padding:8px 14px;
    text-align:right;
    font-weight:700;
    font-size:13px;
    color:var(--gray-900);
    border-top:1px solid var(--gray-300);
  }

  .add-line-row{padding:0 14px 14px;}

  .summary{
    margin-top:10px;
    margin-left:auto;
    width:320px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    font-size:14px;
    border-bottom:1px solid var(--gray-100);
  }
  .summary-row.total{
    background:var(--blue-dark);
    color:#fff;
    font-weight:800;
    font-size:17px;
    padding:10px 12px;
    border-radius:6px;
    margin-top:6px;
    border:none;
  }

  .notes-section{margin-top:30px;}
  .notes-section textarea{min-height:170px;font-size:12.5px;line-height:1.6;font-family:inherit;font-style:italic;}

  @media print{
    @page{ size:A4; margin:12mm; }
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    body{background:#fff;padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none;border-radius:0;max-width:100%;padding:0;}
    .product-table{margin-bottom:12px;}
    .pt-header, .pt-row{grid-template-columns:1fr 50px 75px 60px 100px !important;}
    .carousel-thumb, .main-image-slot{cursor:default;}
    .no-print{display:none !important;}
    input, textarea, select{border:none !important;padding:2px 0;background:transparent !important;}
    select{appearance:none;-webkit-appearance:none;}
    textarea{display:none !important;}
    .print-mirror{
      display:block !important;
      white-space:pre-wrap;
      font-size:13px;
      line-height:1.5;
      color:var(--gray-900);
      font-family:inherit;
    }
    .notes-section .print-mirror{font-size:12.5px;line-height:1.6;font-style:italic;}
    .cat-select-wrap input{background:transparent !important;color:#fff !important;}

    /* orden al imprimir: carrusel de imágenes → código/nombre/descripción/opcionales → imagen principal/números → subtotal */
    .line{padding:12px 14px;}
    .carousel-row{margin-top:10px;flex-wrap:wrap !important;}
    .carousel-thumb{flex:0 0 125px !important;width:125px !important;}
    .line-body{display:block !important;overflow:hidden;}
    .right-col{
      float:right !important;
      width:401px !important;
      margin:0 0 12px 20px !important;
      padding-left:18px !important;
      border-left:1px solid var(--gray-300);
    }
    .main-image-slot{max-width:100% !important;margin:0;}
    .desc-block{display:block !important;}
    .accop-row, .gd-bar, .carousel-row{clear:both;}
    .desc-block{margin-bottom:0;}
    .optionals-box{background:var(--gray-100) !important;}
    .standard-box{background:var(--gray-100) !important;}
    .main-image-slot{width:100% !important;}
    .line-details.collapsed{display:flex !important;}
    .line-footer{display:flex !important;justify-content:flex-end;margin-top:10px;padding-top:8px;}
    .line-total{background:var(--blue-light) !important;}
  }
</style>
</head>

        <div><label class="field-label">Empresa</label><input id="offCompany" value="HEALTHCORP S.A."></div>
        <div><label class="field-label">RUC</label><input id="offRuc" value="0992428678001"></div>
        <div><label class="field-label">Dirección</label><input id="offAddr" value="Quito - Ecuador"></div>
        <div><label class="field-label">Comercial</label><input id="offComercial" placeholder="Nombre del vendedor"></div>
        <div><label class="field-label">Celular</label><input id="offCel" placeholder="09XXXXXXXX"></div>
      </div>
    </div>
    <div class="party-panel">
      <div class="party-title">Datos del cliente</div>
      <div class="party-fields">
        <div><label class="field-label">Cliente</label><input id="clientName" placeholder="Razón social del cliente"></div>
        <div><label class="field-label">RUC</label><input id="clientRuc" placeholder="RUC"></div>
        <div><label class="field-label">Dirección</label><input id="clientAddr" placeholder="Dirección"></div>
        <div><label class="field-label">E-mail</label><input id="clientEmail" placeholder="correo@cliente.com"></div>
        <div><label class="field-label">Celular</label><input id="clientCel" placeholder="09XXXXXXXX"></div>
      </div>
    </div>
  </div>

  <div id="categories"></div>
  <datalist id="category-datalist"></datalist>

  <div class="summary" id="summary"></div>

  <div class="notes-section">
    <label class="field-label">Notas / Términos y condiciones</label>
    <textarea id="notes" oninput="document.getElementById('notes-mirror').textContent=this.value">Términos y Condiciones:

Plazo de entrega: Condicionado a la existencia en inventario.
Forma de Pago: 50% anticipo, 50% contra entrega.
Sitio de entrega: Instalaciones del cliente.

Política de Garantía de fábrica: Todos los equipos médicos vendidos por Healthcorp S.A. tienen un período de garantía de fábrica de un (1) año a partir de la fecha de factura de compra. Esta garantía de fábrica cubre defectos de fabricación de la unidad principal y excluye accesorios y suministros. Para efectos de aplicación de esta garantía debe cumplir con los términos y condiciones detallados en el documento "Acuerdo de garantía de fábrica y políticas de devolución, véase en el ANEXO 1".

Política de Devoluciones: Healthcorp S.A. acepta la devolución del producto adquirido dentro del plazo de 10 días hábiles después de la fecha de factura. En toda devolución que supere los (10) días hábiles, el cliente será responsable de los gastos de envío y una tarifa de reposición del 25% del valor del equipo. Para efectuar una devolución debe cumplir con los términos y condiciones detallados en el documento "Acuerdo de garantía de fábrica y políticas de devolución, véase en el ANEXO 2".

Política de Mantenimiento: Todos los servicios de mantenimiento preventivo y/o correctivo requeridos por el cliente se gestionan bajo cotización y previa planificación, de acuerdo con la disponibilidad técnica y operativa.

Aceptación: Usted certifica que ha leído cuidadosamente y acepta los términos y condiciones establecidos en el "Acuerdo de garantía de fábrica y políticas de devolución".</textarea>
    <div class="print-mirror" id="notes-mirror"></div>
  </div>
</div>

<script>
let state = { categories: [] };
let idCounter = 0;
const uid = () => 'id' + (idCounter++);

const CATEGORY_OPTIONS = [
  'AYUDAS TECNICAS',
  'CABLES Y SENSORES',
  'CABLES Y SENSORES / Baterias',
  'CABLES Y SENSORES / Desfibriladores',
  'CABLES Y SENSORES / ECG',
  'CABLES Y SENSORES / ECO',
  'CABLES Y SENSORES / EKG',
  'CABLES Y SENSORES / ESU',
  'CABLES Y SENSORES / Fetal',
  'CABLES Y SENSORES / IBP',
  'CABLES Y SENSORES / NIBP',
  'CABLES Y SENSORES / O2 / CO2',
  'CABLES Y SENSORES / SpO2',
  'CABLES Y SENSORES / Temperatura',
  'CABLES Y SENSORES / Ventilación',
  'CARDIOLOGIA',
  'CARDIOLOGIA / Electrocardiografos',
  'CARDIOLOGIA / HOLTER',
  'COLPOSCOPIO',
  'DENTAL',
  'DIAGNOSTICO',
  'DIAGNOSTICO / Balanzas',
  'DIAGNOSTICO / Estetoscopios',
  'DIAGNOSTICO / Lámparas de examinación',
  'DIAGNOSTICO / Set de diagnóstico',
  'DIAGNOSTICO / Tensiometros',
  'DIAGNOSTICO / Termómetros - oxímetros',
  'ECOGRAFOS',
  'EMERGENCIA y RESCATE',
  'ENTRENAMIENTO y SIMULACION',
  'Estética',
  'FISIOTERAPIA',
  'GASES MEDICINALES',
  'GINECO-OBS',
  'GINECO-OBS / MONITORES FETALES',
  'INSTRUMENTAL MEDICO',
  'Insumos',
  'Insumos / Esterilización y Desinfección',
  'Insumos / Insumos Anestesia',
  'Insumos / Insumos Diagnóstico',
  'Insumos / Insumos Emergencia',
  'Insumos / Insumos Gin/Obs',
  'Insumos / Insumos Neonatología',
  'Insumos / Insumos-Electrocirugía',
  'Insumos / Insumos-IV',
  'Insumos / Insumos-Monitoreo',
  'Insumos / Papel Térmico',
  'Insumos / Respiración-Ventilación',
  'Insumos / Varios',
  'MOBILIARIO MEDICO',
  'MOBILIARIO MEDICO / CAMAS HOSPITALARIAS',
  'MOBILIARIO MEDICO / Camillas y Sillones',
  'MOBILIARIO MEDICO / COCHES Y MESAS',
  'MOBILIARIO MEDICO / Mobiliario Varios',
  'MONITOREO DE PACIENTE',
  'MONITOREO DE PACIENTE / MONITOR MULTIPARAMETROS',
  'NEONATOLOGIA',
  'NEONATOLOGIA / Bilirrubinómetros',
  'NEONATOLOGIA / Incubadoras',
  'NEONATOLOGIA / Lámparas de fototerapia',
  'NEONATOLOGIA / Termocunas',
  'QUIROFANO',
  'QUIROFANO / Aspirador Quirúrgico',
  'QUIROFANO / ELECTROBISTURI',
  'QUIROFANO / LAMPARAS QUIRURGICAS',
  'QUIROFANO / MAQUINAS DE ANESTESIA',
  'QUIROFANO / MESA QUIRURGICA',
  'Repuestos',
  'TERAPIA RESPIRATORIA',
  'UCI',
  'UCI / BOMBAS DE INFUSION',
  'UCI / Buscador de Venas',
  'UCI / Compresion Neumatica',
  'UCI / DESFIBRILADORES',
  'UCI / LARINGOSCOPIO',
  'UCI / VENTILADORES',
  'VETERINARIA'
];

function newLine(){
  return { id: uid(), images:[], mainImage:null, code:'', title:'', desc:'', qty:1, price:0, tax:15, discount:0, brand:'', origin:'',
    garantiaTexto:'', disponibilidad:'',
    showStandard:false, standardAccessories:'', showOptionals:false, optionals:'' };
}
function newCategory(){
  return { id: uid(), name:'', lines:[newLine()] };
}

function addCategory(){
  state.categories.push(newCategory());
  render();
}
function removeCategory(catId){
  state.categories = state.categories.filter(c => c.id !== catId);
  render();
}
function addLine(catId){
  const cat = state.categories.find(c => c.id === catId);
  cat.lines.push(newLine());
  render();
}
function removeLine(catId, lineId){
  const cat = state.categories.find(c => c.id === catId);
  cat.lines = cat.lines.filter(l => l.id !== lineId);
  render();
}

function escapeHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt(n){
  return '$ ' + (n||0).toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function lineImporte(line){
  const base = (parseFloat(line.qty)||0) * (parseFloat(line.price)||0);
  const disc = parseFloat(line.discount)||0;
  return base * (1 - (disc/100));
}

function computeTotals(){
  let base = 0, iva15 = 0, iva0base = 0;
  state.categories.forEach(cat=>{
    cat.lines.forEach(l=>{
      const imp = lineImporte(l);
      base += imp;
      if(parseFloat(l.tax) === 15) iva15 += imp * 0.15;
      else iva0base += imp;
    });
  });
  return { base, iva15, iva0base, total: base + iva15 };
}

function handleMainImage(catId, lineId, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const line = findLine(catId, lineId);
    line.mainImage = e.target.result;
    render();
  };
  reader.readAsDataURL(file);
}
function removeMainImage(catId, lineId, ev){
  ev.stopPropagation();
  const line = findLine(catId, lineId);
  line.mainImage = null;
  render();
}
function handleExtraImage(catId, lineId, input){
  const file = input.files[0];
  if(!file) return;
  const line = findLine(catId, lineId);
  if(line.images.length >= 9) return;
  const reader = new FileReader();
  reader.onload = e=>{
    line.images.push(e.target.result);
    render();
  };
  reader.readAsDataURL(file);
}
function removeExtraImage(catId, lineId, idx, ev){
  ev.stopPropagation();
  const line = findLine(catId, lineId);
  line.images.splice(idx, 1);
  render();
}

function updateField(catId, lineId, field, value){
  const cat = state.categories.find(c=>c.id===catId);
  const line = cat.lines.find(l=>l.id===lineId);
  line[field] = value;
  render();
}
function updateCatName(catId, value){
  const cat = state.categories.find(c=>c.id===catId);
  cat.name = value;
  render();
}
function toggleDetails(catId, lineId, field){
  const line = findLine(catId, lineId);
  line[field] = !line[field];
  render();
}
function findLine(catId, lineId){
  const cat = state.categories.find(c=>c.id===catId);
  return cat.lines.find(l=>l.id===lineId);
}
function toggleStandardBox(catId, lineId){
  const line = findLine(catId, lineId);
  line.showStandard = !line.showStandard;
  render();
}
function toggleOptionalsBox(catId, lineId){
  const line = findLine(catId, lineId);
  line.showOptionals = !line.showOptionals;
  render();
}

function render(){
  const wrap = document.getElementById('categories');
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;

  wrap.innerHTML = state.categories.map(cat=>{
    const catSubtotal = cat.lines.reduce((s,l)=>s+lineImporte(l),0);
    return `
    <div class="category">
      <div class="category-header">
        <div class="cat-select-wrap" style="display:flex;gap:8px;flex:1;align-items:center;">
          <input id="f_cat_${cat.id}" list="category-datalist" placeholder="Escribe para buscar una categoría..." value="${cat.name}" oninput="updateCatName('${cat.id}', this.value)" style="max-width:320px;">
        </div>
        <button class="btn btn-sm cat-remove no-print" style="margin-left:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);" onclick="removeCategory('${cat.id}')">Eliminar categoría</button>
      </div>
      ${cat.lines.map(line=>{
        const imp = lineImporte(line);
        return `
        <div class="line">
          <div class="product-table">
            <div class="pt-header">
              <div>Producto</div>
              <div>Cant.</div>
              <div>P. Unitario</div>
              <div>Desc. %</div>
              <div>Total</div>
            </div>
            <div class="pt-row">
              <div class="pt-product">
                <input id="f_${line.id}_title" class="pt-name" placeholder="Nombre del producto" value="${line.title}" oninput="updateField('${cat.id}','${line.id}','title', this.value)">
                <div class="pt-meta">
                  <span>Ref: <input id="f_${line.id}_code" placeholder="Código" value="${line.code}" oninput="updateField('${cat.id}','${line.id}','code', this.value)"></span>
                  <span>Marca: <input id="f_${line.id}_brand" placeholder="Marca" value="${line.brand}" oninput="updateField('${cat.id}','${line.id}','brand', this.value)"></span>
                  <span>Procedencia: <input id="f_${line.id}_origin" placeholder="País" value="${line.origin}" oninput="updateField('${cat.id}','${line.id}','origin', this.value)"></span>
                </div>
              </div>
              <div class="pt-num"><input id="f_${line.id}_qty" type="text" inputmode="numeric" value="${line.qty}" oninput="updateField('${cat.id}','${line.id}','qty', this.value)"></div>
              <div class="pt-num"><input id="f_${line.id}_price" type="text" inputmode="decimal" value="${line.price}" oninput="updateField('${cat.id}','${line.id}','price', this.value)"></div>
              <div class="pt-num"><input id="f_${line.id}_discount" type="text" inputmode="decimal" value="${line.discount}" oninput="updateField('${cat.id}','${line.id}','discount', this.value)"></div>
              <div class="pt-total">${fmt(imp)}</div>
            </div>
          </div>

          <div class="line-body">
            <div class="right-col">
              <div class="main-image-slot ${line.mainImage ? 'filled' : ''}" onclick="document.getElementById('main_${line.id}').click()">
                ${line.mainImage ? `<img src="${line.mainImage}"><button class="img-remove no-print" onclick="removeMainImage('${cat.id}','${line.id}', event)">×</button>` : '+ Imagen principal'}
                <input type="file" accept="image/*" id="main_${line.id}" onchange="handleMainImage('${cat.id}','${line.id}', this)">
              </div>
            </div>

            <div class="desc-block">
              <span class="section-badge">Configuración estándar</span>
              <textarea id="f_${line.id}_desc" placeholder="Especificaciones técnicas, medidas, accesorios incluidos..." oninput="updateField('${cat.id}','${line.id}','desc', this.value)">${line.desc||''}</textarea>
              <div class="print-mirror">${escapeHtml(line.desc)}</div>
            </div>
          </div>

          <div class="accop-row">
            <div class="accop-col">
              <button type="button" class="details-toggle no-print" onclick="toggleStandardBox('${cat.id}','${line.id}')">${line.showStandard ? '– Ocultar accesorios estándar' : '+ Accesorios estándar'}</button>
              ${line.showStandard ? `
              <div class="standard-box">
                <div class="box-header">Accesorios estándar</div>
                <div class="box-body">
                  <textarea id="f_${line.id}_standardAccessories" placeholder="Describe los accesorios que incluye..." oninput="updateField('${cat.id}','${line.id}','standardAccessories', this.value)">${line.standardAccessories||''}</textarea>
                  <div class="print-mirror">${escapeHtml(line.standardAccessories)}</div>
                </div>
              </div>` : ''}
            </div>
            <div class="accop-col">
              <button type="button" class="details-toggle no-print" onclick="toggleOptionalsBox('${cat.id}','${line.id}')">${line.showOptionals ? '– Ocultar opcionales' : '+ Opcionales'}</button>
              ${line.showOptionals ? `
              <div class="optionals-box">
                <div class="box-header">Opcionales</div>
                <div class="box-body">
                  <textarea id="f_${line.id}_optionals" placeholder="Describe las opciones o configuraciones opcionales..." oninput="updateField('${cat.id}','${line.id}','optionals', this.value)">${line.optionals||''}</textarea>
                  <div class="print-mirror">${escapeHtml(line.optionals)}</div>
                </div>
              </div>` : ''}
            </div>
          </div>

          <div class="gd-bar">
            <div class="gd-cell">
              <span class="gd-label">Garantía:</span>
              <input id="f_${line.id}_garantiaTexto" placeholder="Ej. 12 meses" value="${line.garantiaTexto||''}" oninput="updateField('${cat.id}','${line.id}','garantiaTexto', this.value)">
            </div>
            <div class="gd-cell">
              <span class="gd-label">Disponibilidad:</span>
              <input id="f_${line.id}_disponibilidad" placeholder="Ej. 90 días" value="${line.disponibilidad||''}" oninput="updateField('${cat.id}','${line.id}','disponibilidad', this.value)">
            </div>
          </div>

          <div class="carousel-row">
            ${line.images.map((img,idx)=>`
              <div class="carousel-thumb">
                <img src="${img}">
                <button class="img-remove no-print" onclick="removeExtraImage('${cat.id}','${line.id}',${idx}, event)">×</button>
              </div>
            `).join('')}
            ${line.images.length < 9 ? `
            <div class="carousel-thumb add-thumb no-print" onclick="document.getElementById('extra_${line.id}').click()">
              + Agregar imagen
              <input type="file" accept="image/*" id="extra_${line.id}" onchange="handleExtraImage('${cat.id}','${line.id}', this)">
            </div>` : ''}
          </div>

          <div class="line-footer">
            <button class="btn btn-sm btn-danger no-print" onclick="removeLine('${cat.id}','${line.id}')">Quitar producto</button>
            <div class="line-total">Subtotal producto: ${fmt(imp)}</div>
          </div>
        </div>`;
      }).join('')}
      <div class="cat-subtotal">Subtotal categoría: ${fmt(catSubtotal)}</div>
      <div class="add-line-row">
        <button class="btn btn-sm btn-outline btn-add-line no-print" onclick="addLine('${cat.id}')">+ Agregar producto</button>
      </div>
    </div>`;
  }).join('') || '<p style="color:#8a94a0;text-align:center;padding:30px;">Sin categorías aún. Haz clic en "+ Agregar categoría" para empezar.</p>';

  const t = computeTotals();
  document.getElementById('summary').innerHTML = `
    <div class="summary-row"><span>Subtotal</span><span>${fmt(t.base)}</span></div>
    <div class="summary-row"><span>IVA 15%</span><span>${fmt(t.iva15)}</span></div>
    <div class="summary-row total"><span>Total a pagar</span><span>${fmt(t.total)}</span></div>
  `;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// init con una categoría de ejemplo
document.getElementById('category-datalist').innerHTML = CATEGORY_OPTIONS.map(opt=>`<option value="${opt}">`).join('');
addCategory();
document.getElementById('notes-mirror').textContent = document.getElementById('notes').value;
</script>
