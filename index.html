<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title> </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --blue-dark:#183B56;
    --blue:#528CB0;
    --blue-light:#EAF7F8;
    --teal:#528CB0;
    --accent:#08A9B7;
    --accent-light:#EAF7F8;
    --gray-mouse:#183B56;
    --bright-orange:#fff200;
    --gray-900:#1f2937;
    --gray-600:#667987;
    --gray-300:#d8dee5;
    --gray-200:#e7ebee;
    --gray-100:#f4f6f8;
    --red:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e9edf1;
    margin:0;
    padding:24px;
    color:var(--gray-900);
  }
  .toolbar{
    max-width:1000px;
    margin:0 auto 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .save-menu-wrap{position:relative;}
  .save-menu{
    position:absolute;
    top:100%;
    left:0;
    margin-top:4px;
    background:#fff;
    border:1px solid var(--gray-300);
    border-radius:8px;
    box-shadow:0 6px 16px rgba(0,0,0,.15);
    overflow:hidden;
    z-index:100;
    min-width:200px;
  }
  .save-menu button{
    display:block;
    width:100%;
    text-align:left;
    padding:10px 14px;
    background:#fff;
    border:none;
    border-bottom:1px solid var(--gray-100);
    font-size:14px;
    color:var(--gray-900);
    cursor:pointer;
  }
  .save-menu button:last-child{border-bottom:none;}
  .save-menu button:hover{background:var(--gray-100);}
  .btn{
    border:none;
    border-radius:6px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s;
  }
  .btn:hover{filter:brightness(0.92);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-dark{background:var(--blue-dark);color:#fff;}
  .btn-outline{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue-dark);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn-sm{padding:6px 10px;font-size:12px;}

  .sheet{
    max-width:1000px;
    margin:0 auto;
    background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.08);
    border-radius:4px;
    padding:40px 44px;
  }
  .quote-box{width:fit-content;}
  .cotiz-banner{
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;
    padding:9px 14px;
    border-radius:6px 6px 0 0;
  }
  .doc-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:3px solid var(--blue);
    padding-bottom:14px;
    margin-bottom:20px;
    gap:20px;
  }
  .logo-img{height:100px;width:auto;display:block;max-width:340px;object-fit:contain;}
  .quote-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
  .quote-num-row{
    display:flex;
    border:1px solid var(--gray-300);
    border-top:none;
    border-radius:0 0 6px 6px;
    overflow:hidden;
  }
  .qn-label{
    background:var(--gray-100);
    color:var(--gray-600);
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:9px 14px;
    display:flex;
    align-items:center;
    white-space:nowrap;
    border-right:1px solid var(--gray-300);
  }
  .qn-value{
    background:#fff;
    padding:5px 12px;
    display:flex;
    align-items:center;
  }
  .qn-value input{
    border:none;
    padding:0;
    font-size:15px;
    font-weight:700;
    color:var(--gray-900);
    width:110px;
  }
  .quote-dates{display:flex;gap:12px;justify-content:flex-end;margin-top:10px;}
  .quote-dates > div{width:130px;}
  .quote-dates .field-label{margin-bottom:2px;}

  .parties-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:24px;
  }
  .party-panel{
    border:1px solid var(--gray-300);
    border-radius:6px;
    padding:12px 14px;
  }
  .party-title{
    font-weight:800;
    color:var(--blue-dark);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:10px;
    border-bottom:1px solid var(--gray-100);
    padding-bottom:6px;
  }
  .party-fields{display:flex;flex-direction:column;gap:7px;}
  .party-fields > div{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;}
  .party-fields .field-label{margin-bottom:0;}
  .party-fields input{padding:5px 8px;font-size:13px;}
  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--gray-600);
    font-weight:700;
    margin-bottom:4px;
    display:block;
  }
  input, textarea, select{
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--gray-300);
    border-radius:5px;
    padding:7px 9px;
    width:100%;
    color:var(--gray-900);
  }
  textarea{resize:vertical;}
  .print-mirror{display:none;}
  .bullet-list{list-style:none;margin:0;padding:0;}
  .bullet-list li{position:relative;padding-left:14px;margin-bottom:3px;}
  .bullet-list li::before{content:'';position:absolute;left:0;top:0.55em;width:4px;height:4px;border-radius:50%;background:currentColor;}

  .category{
    margin-bottom:22px;
    border:1px solid var(--gray-300);
    border-radius:6px;
  }
  .category.no-header{border:none;margin-bottom:8px;}
  .category-header{
    border-radius:6px 6px 0 0;
    background:var(--accent);
    color:#fff;
    padding:9px 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .category-header input{
    background:transparent;
    border:none;
    color:#fff;
    font-weight:700;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:2px 4px;
  }
  .category-header input::placeholder{color:#cfe3f5;}
  .cat-dropdown{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    right:0;
    max-width:320px;
    max-height:230px;
    overflow-y:auto;
    background:#fff;
    border:1px solid var(--gray-300);
    border-radius:0 0 6px 6px;
    box-shadow:0 6px 14px rgba(0,0,0,.15);
    z-index:50;
    margin-top:2px;
  }
  .cat-dropdown-item{
    padding:8px 12px;
    font-size:13px;
    color:var(--gray-900);
    cursor:pointer;
  }
  .cat-dropdown-item:hover{background:var(--gray-100);}

  .line{
    padding:16px 14px 14px;
    border-top:2px solid var(--blue);
  }
  .line:first-of-type{border-top:none;padding-top:14px;}

  .carousel-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .carousel-thumb{
    flex:0 0 165px;
    width:165px;
    aspect-ratio:1/1;
    border:1.5px dashed var(--gray-300);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    line-height:1.3;
    color:var(--gray-600);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background:var(--gray-100);
    text-align:center;
    padding:4px;
  }
  .carousel-thumb.add-thumb{border-color:var(--blue);color:var(--blue);font-weight:700;background:var(--blue-light);}
  .carousel-thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;position:relative;}
  .carousel-thumb input[type=file]{display:none;}

  .line-body{
    display:grid;
    grid-template-columns:1fr 544px;
    gap:18px;
    align-items:center;
  }
  .desc-block{grid-column:1;}
  .right-col{grid-column:2;display:flex;flex-direction:column;align-items:center;}
  .main-image-slot{
    width:100%;
    aspect-ratio:1/1;
    border:1.5px dashed var(--gray-300);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:var(--gray-600);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background:var(--gray-100);
    text-align:center;
    padding:6px;
  }
  .main-image-slot.filled{border-style:solid;border-color:var(--gray-300);}
  .main-image-slot:focus{outline:2px solid var(--blue);outline-offset:2px;}
  .main-image-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .main-image-slot input[type=file]{display:none;}

  .img-remove{
    position:absolute;top:3px;right:3px;
    background:rgba(0,0,0,.55);color:#fff;
    border:none;border-radius:50%;
    width:18px;height:18px;font-size:11px;
    cursor:pointer;line-height:1;
    z-index:2;
  }

  .desc-block textarea{min-height:110px;font-size:13px;line-height:1.5;}
  .desc-block .field-label{margin-top:8px;}

  .product-table{
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    margin:0 auto 14px;
    width:calc(100% - 38px);
  }
  .pt-header{
    display:grid;
    grid-template-columns:1fr 55px 80px 65px 110px;
    background:var(--gray-mouse);
    color:#fff;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .pt-header > div{padding:7px 10px;}
  .pt-row{
    display:grid;
    grid-template-columns:1fr 55px 80px 65px 110px;
    align-items:stretch;
    background:var(--bright-orange);
  }
  .pt-row > div{
    padding:9px 10px;
    border-top:1px solid #fff;
    border-left:1px solid #fff;
    display:flex;
    align-items:center;
    min-width:0;
  }
  .pt-row > div:first-child{border-left:none;}
  .pt-product{flex-direction:column !important;align-items:flex-start !important;gap:4px;min-width:0;}
  .pt-name{
    border:none;
    padding:0;
    font-weight:700;
    font-size:15px;
    color:var(--gray-900);
    width:100%;
  }
  .pt-meta{display:flex;flex-wrap:nowrap;gap:10px;font-size:11px;color:var(--gray-600);min-width:0;overflow:hidden;}
  .pt-meta span{display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0;}
  .pt-meta input{
    border:none;
    padding:0;
    font-size:11px;
    font-weight:700;
    color:var(--gray-900);
    width:64px;
    min-width:0;
  }
  .pt-num input{
    border:none;
    padding:0;
    text-align:center;
    font-weight:600;
  }
  .pt-num select{
    border:none;
    padding:0;
    text-align:center;
    font-weight:600;
    width:100%;
    background:transparent;
  }
  .pt-total{
    font-weight:800;
    color:var(--blue-dark);
    justify-content:flex-end !important;
  }


  .section-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:5px 10px;
    border-radius:4px;
    margin-bottom:8px;
  }

  .optionals-box{
    margin-top:10px;
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    background:var(--gray-100);
  }
  .optionals-box textarea, .standard-box textarea{min-height:70px;font-size:13px;line-height:1.5;background:#fff;}
  .box-header{
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:7px 10px;
  }
  .box-body{padding:8px 10px;}

  .gd-bar{
    display:grid;
    grid-template-columns:1fr 1fr;
    width:100%;
    min-height:42px;
    margin-top:12px;
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    page-break-inside:avoid;
  }
  .gd-cell{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 12px;
    border-left:1px solid var(--gray-300);
  }
  .gd-cell:first-child{border-left:none;}
  .gd-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--gray-600);
    white-space:nowrap;
  }
  .gd-cell input{border:none;padding:2px 0;font-weight:600;color:var(--gray-900);width:50px;flex:none;}
  .gd-unit{font-size:12px;color:var(--gray-600);}

  .cert-box{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    min-height:38px;
    margin-top:10px;
    padding:0 12px;
    background:var(--gray-100);
    border:1px solid var(--gray-300);
    border-radius:6px;
  }
  .cert-box input{border:none;padding:2px 0;font-weight:600;color:var(--gray-900);flex:1;background:transparent;}

  .accop-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:14px;
  }
  .accop-col{min-width:0;}

  .standard-box{
    margin-top:10px;
    border:1px solid var(--gray-300);
    border-radius:6px;
    overflow:hidden;
    background:var(--gray-100);
  }

  .line-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--gray-300);
  }
  .line-total{
    background:var(--blue-light);
    border-radius:6px;
    padding:8px 12px;
    text-align:right;
    font-weight:700;
    color:var(--blue-dark);
    font-size:15px;
  }
  .details-toggle{
    background:none;
    border:none;
    color:var(--blue);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    cursor:pointer;
    padding:2px 0;
    text-align:left;
    width:auto;
  }
  .details-toggle:hover{text-decoration:underline;}
  .line-details.collapsed{display:none;}

  .cat-subtotal{
    background:var(--gray-100);
    padding:8px 14px;
    text-align:right;
    font-weight:700;
    font-size:13px;
    color:var(--gray-900);
    border-top:1px solid var(--gray-300);
    border-radius:0 0 6px 6px;
  }

  .add-line-row{padding:0 14px 14px;}

  .doc-extra-section{margin:26px 0;}
  .doc-extra-section .product-table{margin-bottom:10px;}
  .service-desc-toggle{margin-bottom:8px;}
  .service-desc-box{
    background:var(--gray-100);
    border:1px solid var(--gray-300);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .service-desc-box textarea{min-height:55px;font-size:13px;line-height:1.5;background:#fff;}
  .service-remove-row{display:flex;justify-content:flex-end;margin-bottom:18px;}

  .summary{
    margin-top:10px;
    margin-left:auto;
    width:320px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    font-size:14px;
    border-bottom:1px solid var(--gray-100);
  }
  .summary-row.total{
    background:var(--blue-dark);
    color:#fff;
    font-weight:800;
    font-size:17px;
    padding:10px 12px;
    border-radius:6px;
    margin-top:6px;
    border:none;
  }


  @media print{
    @page{ size:A4; margin:12mm; }
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    body{background:#fff;padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none;border-radius:0;max-width:100%;padding:0;}
    .product-table{margin-bottom:12px;}
    .pt-header, .pt-row{grid-template-columns:1fr 50px 75px 60px 100px !important;}
    .carousel-thumb, .main-image-slot{cursor:default;}
    .no-print{display:none !important;}
    input, textarea, select{border:none !important;padding:2px 0;background:transparent !important;}
    select{appearance:none;-webkit-appearance:none;}
    textarea{display:none !important;}
    .print-mirror{
      display:block !important;
      white-space:pre-wrap;
      font-size:13px;
      line-height:1.5;
      color:var(--gray-900);
      font-family:inherit;
    }
    .cat-select-wrap input{background:transparent !important;color:#fff !important;}

    /* orden al imprimir: carrusel de imágenes → código/nombre/descripción/opcionales → imagen principal/números → subtotal */
    .line{padding:12px 14px;}
    .carousel-row{margin-top:10px;flex-wrap:wrap !important;}
    .carousel-thumb{flex:0 0 144px !important;width:144px !important;}
    .line-body{display:block !important;overflow:hidden;}
    .right-col{
      float:right !important;
      width:401px !important;
      margin:0 0 12px 20px !important;
      padding-left:18px !important;
      border-left:1px solid var(--gray-300);
    }
    .main-image-slot{max-width:100% !important;margin:0;}
    .desc-block{display:block !important;}
    .accop-row, .gd-bar, .carousel-row{clear:both;}
    .desc-block{margin-bottom:0;}
    .optionals-box{background:var(--gray-100) !important;}
    .standard-box{background:var(--gray-100) !important;}
    .main-image-slot{width:100% !important;}
    .line-details.collapsed{display:flex !important;}
    .line-footer{display:flex !important;justify-content:flex-end;margin-top:10px;padding-top:8px;}
    .line-total{background:var(--blue-light) !important;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="save-menu-wrap">
    <button class="btn btn-dark" onclick="toggleSaveMenu(event)">Guardar cotización ▾</button>
    <div class="save-menu no-print" id="saveMenu" style="display:none;">
      <button onclick="closeSaveMenu(); window.print();">🖨️ Imprimir</button>
      <button onclick="closeSaveMenu(); window.print();">📄 Exportar a PDF</button>
      <button onclick="closeSaveMenu(); exportExcel();">📊 Exportar a Excel</button>
    </div>
  </div>
</div>

function buildExportRows(){
  const rows = [['Categoría','Tipo','Código','Nombre','Marca','Procedencia','Cantidad','Precio unitario','Descuento %','Total']];
  state.categories.forEach(cat=>{
    cat.lines.forEach(l=>{
      rows.push([cat.name || '', 'Producto', l.code||'', l.title||'', l.brand||'', l.origin||'', l.qty||0, l.price||0, l.discount||0, Number(lineImporte(l).toFixed(2))]);
    });
  });
  state.services.forEach(s=>{
    rows.push(['', 'Servicio', s.code||'', s.text||'', '', '', s.qty||0, s.price||0, s.discount||0, Number(serviceImporte(s).toFixed(2))]);
  });
  const t = computeTotals();
  rows.push([]);
  rows.push(['','','','','','','','','Subtotal', Number(t.base.toFixed(2))]);
  rows.push(['','','','','','','','','IVA 15%', Number(t.iva15.toFixed(2))]);
  rows.push(['','','','','','','','','Total a pagar', Number(t.total.toFixed(2))]);
  return rows;
}
function getQuoteFileName(){
  return (document.getElementById('quoteNum')?.value || 'cotizacion').replace(/[^a-zA-Z0-9-]/g,'_');
}
function exportExcel(){
  if(typeof XLSX === 'undefined'){
    alert('No se pudo cargar el módulo de Excel. Verifica tu conexión a internet e intenta de nuevo.');
    return;
  }
  const rows = buildExportRows();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:10},{wch:12},{wch:30},{wch:14},{wch:14},{wch:10},{wch:14},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Cotización');
  XLSX.writeFile(wb, `cotizacion_${getQuoteFileName()}.xlsx`);
}
function toggleSaveMenu(ev){
  if(ev) ev.stopPropagation();
  const menu = document.getElementById('saveMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
function closeSaveMenu(){
  document.getElementById('saveMenu').style.display = 'none';
}
document.addEventListener('click', (e)=>{
  const wrap = document.querySelector('.save-menu-wrap');
  if(wrap && !wrap.contains(e.target)) closeSaveMenu();
});
function renderBullets(text){
  const items = (text||'').split(/[.,\n]+/).map(s=>s.trim()).filter(s=>s.length>0);
  if(items.length===0) return '';
  return '<ul class="bullet-list">' + items.map(i=>`<li>${escapeHtml(i)}</li>`).join('') + '</ul>';
}
function fmt(n){
  return '$ ' + (n||0).toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function lineImporte(line){
  const base = (parseFloat(line.qty)||0) * (parseFloat(line.price)||0);
  const disc = parseFloat(line.discount)||0;
  return base * (1 - (disc/100));
}

function computeTotals(){
  let base = 0, iva15 = 0, iva0base = 0;
  state.categories.forEach(cat=>{
    cat.lines.forEach(l=>{
      const imp = lineImporte(l);
      base += imp;
      if(parseFloat(l.tax) === 15) iva15 += imp * 0.15;
      else iva0base += imp;
    });
  });
  state.services.forEach(s=>{
    const imp = serviceImporte(s);
    base += imp;
    iva15 += imp * 0.15;
  });
  return { base, iva15, iva0base, total: base + iva15 };
}

function handleMainImage(catId, lineId, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const line = findLine(catId, lineId);
    line.mainImage = e.target.result;
    render();
  };
  reader.readAsDataURL(file);
}
function handleMainImagePaste(catId, lineId, e){
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type && item.type.indexOf('image') !== -1){
      const file = item.getAsFile();
      if(file){
        e.preventDefault();
        e.stopPropagation();
        const line = findLine(catId, lineId);
        if(line){
          const reader = new FileReader();
          reader.onload = ev=>{ line.mainImage = ev.target.result; render(); };
          reader.readAsDataURL(file);
        }
      }
      break;
    }
  }
}
function removeMainImage(catId, lineId, ev){
  ev.stopPropagation();
  const line = findLine(catId, lineId);
  line.mainImage = null;
  render();
}
function handleExtraImage(catId, lineId, input){
  const files = Array.from(input.files || []);
  if(files.length === 0) return;
  addImagesToLine(catId, lineId, files);
  input.value = '';
}
function addImagesToLine(catId, lineId, files){
  const line = findLine(catId, lineId);
  if(!line) return;
  files.forEach(file=>{
    if(line.images.length >= 9) return;
    if(!file.type || file.type.indexOf('image') === -1) return;
    const reader = new FileReader();
    reader.onload = e=>{
      line.images.push(e.target.result);
      render();
    };
    reader.readAsDataURL(file);
  });
}
function removeExtraImage(catId, lineId, idx, ev){
  ev.stopPropagation();
  const line = findLine(catId, lineId);
  line.images.splice(idx, 1);
  render();
}

function updateField(catId, lineId, field, value){
  const cat = state.categories.find(c=>c.id===catId);
  const line = cat.lines.find(l=>l.id===lineId);
  line[field] = value;
  render();
}
function updateCatName(catId, value){
  const cat = state.categories.find(c=>c.id===catId);
  cat.name = value;
  render();
}
function updateCatNameLive(catId, value){
  const cat = state.categories.find(c=>c.id===catId);
  if(cat) cat.name = value;
}
function filterCategoryOptions(catId, query){
  const dropdown = document.getElementById('cat-dropdown-' + catId);
  if(!dropdown) return;
  const q = (query||'').toLowerCase().trim();
  const matches = CATEGORY_OPTIONS.filter(o => o.toLowerCase().includes(q)).slice(0, 40);
  if(matches.length === 0){
    dropdown.style.display = 'none';
    dropdown.innerHTML = '';
    return;
  }
  dropdown.innerHTML = matches.map(m => `<div class="cat-dropdown-item" onmousedown="selectCategoryOption('${catId}', '${m.replace(/'/g,"\\'")}')">${m}</div>`).join('');
  dropdown.style.display = 'block';
}
function hideCategoryDropdown(catId){
  const dropdown = document.getElementById('cat-dropdown-' + catId);
  if(dropdown) dropdown.style.display = 'none';
}
function selectCategoryOption(catId, value){
  const cat = state.categories.find(c=>c.id===catId);
  cat.name = value;
  hideCategoryDropdown(catId);
  render();
}
function toggleDetails(catId, lineId, field){
  const line = findLine(catId, lineId);
  line[field] = !line[field];
  render();
}
function findLine(catId, lineId){
  const cat = state.categories.find(c=>c.id===catId);
  return cat.lines.find(l=>l.id===lineId);
}
function toggleStandardBox(catId, lineId){
  const line = findLine(catId, lineId);
  line.showStandard = !line.showStandard;
  render();
}
function toggleOptionalsBox(catId, lineId){
  const line = findLine(catId, lineId);
  line.showOptionals = !line.showOptionals;
  render();
}
function toggleDocBox(kind){
  const box = document.getElementById('box-' + kind);
  const btn = document.getElementById('btn-show' + kind.charAt(0).toUpperCase() + kind.slice(1));
  const label = kind === 'service' ? 'Servicio' : 'Nota';
  const willShow = box.style.display === 'none';
  box.style.display = willShow ? 'block' : 'none';

}

  state.services.push({ id: uid(), code:'', text:'', qty:1, price:0, discount:0, description:'', showCode:false, showDescription:false });
  render();
}
function updateServiceField(idx, field, value){
  if(state.services[idx]) state.services[idx][field] = value;

}
function removeServiceRow(idx){

}
function toggleServiceCode(idx){

function toggleServiceDescription(idx){
  if(state.services[idx]) state.services[idx].showDescription = !state.services[idx].showDescription;

}
function serviceImporte(s){
  const base = (parseFloat(s.qty)||0) * (parseFloat(s.price)||0);

    <div class="product-table">

  const wrap = document.getElementById('categories');

  const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;

  wrap.innerHTML = state.categories.map((cat, catIdx)=>{
    const catSubtotal = cat.lines.reduce((s,l)=>s+lineImporte(l),0);
    return `
    <div class="category ${cat.showHeader ? '' : 'no-header'}">
      ${cat.showHeader ? `

        <div class="cat-select-wrap" style="display:flex;gap:8px;flex:1;align-items:center;position:relative;">
          <input id="f_cat_${cat.id}" autocomplete="off" placeholder="Escribe para buscar o crear una categoría..." value="${cat.name}"

      ${cat.lines.map(line=>{
        const imp = lineImporte(line);
        return `
        <div class="line" data-cat-id="${cat.id}" data-line-id="${line.id}">
          <div class="product-table">

              <div>P. Unitario</div>

              <div class="pt-product">
                <input id="f_${line.id}_title" class="pt-name" placeholder="Nombre del producto" value="${line.title}" oninput="updateField('${cat.id}','${line.id}','title', this.value)">

                  <span>Marca: <input id="f_${line.id}_brand" placeholder="Marca" value="${line.brand}" oninput="updateField('${cat.id}','${line.id}','brand', this.value)"></span>
                  <span>Procedencia: <input id="f_${line.id}_origin" placeholder="País" value="${line.origin}" oninput="updateField('${cat.id}','${line.id}','origin', this.value)"></span>
                </div>
              </div>
              <div class="pt-num"><input id="f_${line.id}_qty" type="text" inputmode="numeric" value="${line.qty}" oninput="updateField('${cat.id}','${line.id}','qty', this.value)"></div>
              <div class="pt-num"><input id="f_${line.id}_price" type="text" inputmode="decimal" value="${line.price}" oninput="updateField('${cat.id}','${line.id}','price', this.value)"></div>

              <div class="pt-total">${fmt(imp)}</div>

          <div class="line-body">

                ${line.mainImage ? `<img src="${line.mainImage}"><button class="img-remove no-print" onclick="removeMainImage('${cat.id}','${line.id}', event)">×</button>` : '+ Imagen principal'}
                <input type="file" accept="image/*" id="main_${line.id}" onchange="handleMainImage('${cat.id}','${line.id}', this)">

              <div class="print-mirror">${escapeHtml(line.desc)}</div>

      ${cat.showHeader ? `<div class="cat-subtotal">Subtotal categoría: ${fmt(catSubtotal)}</div>` : ''}
      <div class="add-line-row">
        <button class="btn btn-sm btn-outline btn-add-line no-print" onclick="addLine('${cat.id}')">+ Agregar producto</button>

        ${catIdx === state.categories.length - 1 ? `<button class="btn btn-sm btn-outline no-print" onclick="addCategory()">+ Agregar categoría</button>` : ''}

  const t = computeTotals();
  document.getElementById('summary').innerHTML = `
    <div class="summary-row"><span>Subtotal</span><span>${fmt(t.base)}</span></div>
    <div class="summary-row"><span>IVA 15%</span><span>${fmt(t.iva15)}</span></div>

  `;

  renderServiceRows();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// init con una categoría de ejemplo
let activeLine = null;
document.addEventListener('click', (e)=>{
  const lineEl = e.target.closest('.line');
  if(lineEl){
    const isMain = !!e.target.closest('.main-image-slot');
    activeLine = { catId: lineEl.dataset.catId, lineId: lineEl.dataset.lineId, target: isMain ? 'main' : 'extra' };
  }
});
document.addEventListener('paste', (e)=>{
  if(!activeLine) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  const files = [];
  for(const item of items){
    if(item.type && item.type.indexOf('image') !== -1){
      const file = item.getAsFile();
      if(file) files.push(file);
    }
  }
  if(files.length){
    e.preventDefault();
    if(activeLine.target === 'main'){
      const line = findLine(activeLine.catId, activeLine.lineId);
      if(line){
        const reader = new FileReader();
        reader.onload = ev=>{ line.mainImage = ev.target.result; render(); };
        reader.readAsDataURL(files[0]);
      }
    } else {
      addImagesToLine(activeLine.catId, activeLine.lineId, files);
    }
  }
});

state.categories.push(newCategory(false));
render();
</script>
